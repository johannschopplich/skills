server_tokens off;
access_log off;
client_max_body_size 64m;
charset utf-8;
http2 on;

# Missing from nginx.org's mime.types.
types {
    text/javascript mjs;
    application/manifest+json webmanifest;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json
           application/manifest+json text/xml application/xml application/rss+xml
           application/atom+xml image/svg+xml image/x-icon text/plain text/markdown application/wasm;

# TLSRef intermediate (formerly Mozilla), https://configurator.tlsref.org/ – ssl_ecdh_curve stays auto for X25519MLKEM768.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# A location's own add_header keeps these instead of replacing them.
add_header_inherit merge;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=63072000" always;

map $uri $static_cache_control {
    default                 "no-cache";
    ~*\.(?:woff2?|ttf|otf)$ "public, max-age=604800";
}
