index index.php index.html;

# Renewals of Cloudflare-proxied sites arrive here: the edge redirects the challenge to HTTPS.
location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

# `return` writes no error-log line, unlike `deny`: scanners probing for dotfiles stay out of the logs.
location ~ /\.(?!well-known/)|\.php$ { return 404; }

# Unhashed files revalidate, so a deploy shows at once.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.php$is_args$args;
}

# Vite output with hashed filenames.
location /dist/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Kirby media URLs carry a content hash; a missing thumb is generated by Kirby.
location /media/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri /index.php$is_args$args;
}
